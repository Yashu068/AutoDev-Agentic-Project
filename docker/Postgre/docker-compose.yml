version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: agentic_postgres

    restart: always

    environment:
      POSTGRES_USER: sarv
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agentic_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: